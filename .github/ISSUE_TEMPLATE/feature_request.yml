name: 功能建议
description: 提出新功能或现有功能的改进建议。
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议！作者会评估使用场景和实现方式，并持续增加、完善功能；采纳与进度会在 Issue 中说明。
        **请勿提交密钥、连接码或个人课程信息。**
  - type: textarea
    id: scenario
    attributes:
      label: 希望解决什么问题？
      description: 请描述具体使用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望新增或改进什么功能？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 补充说明或参考效果（可选）
